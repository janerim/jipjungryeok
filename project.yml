## 집중력 (Jipjungryeok) — XcodeGen 프로젝트 정의
##
## 이 파일이 프로젝트의 유일한 소스 오브 트루스다.
## .xcodeproj 는 생성물이므로 git 에 넣지 않는다 (.gitignore 참고).
##
##   $ brew install xcodegen
##   $ xcodegen generate
##   $ open Jipjungryeok.xcodeproj
##
## 타겟 구성 (§9): FocusCore(로컬 패키지) / Jipjungryeok(iOS 앱) / FocusWidgets(위젯 익스텐션)

name: Jipjungryeok

options:
  bundleIdPrefix: com.janerim
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

## 앱·위젯 공통 빌드 설정
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ## 버전은 **여기서만** 고친다. Xcode GUI 에서 고치면 다음 xcodegen generate 에
    ## 날아간다 — 1.0 을 올릴 때 실제로 그랬다(project.yml 은 0.1.0 인데 스토어는 1.0).
    ## 업로드할 때마다 CURRENT_PROJECT_VERSION 을 올려야 App Store Connect 가 받는다.
    ## 자동 서명이므로 최초 1회 Xcode > Signing & Capabilities 에서 팀만 선택하면 된다.
    ## 팀 ID 는 scripts/setup-device-signing.sh 가 인증서에서 뽑아 채운다.
    DEVELOPMENT_TEAM: AN8NXDLMN7
    ## iPhone 전용 (§1-1). 아래 각 타겟에서 다시 선언하는 이유는, XcodeGen 이
    ## 타겟 레벨에 자체 기본값(1,2)을 써서 이 프로젝트 레벨 설정을 덮기 때문이다.
    ## 여기만 적어 두면 빌드 결과의 UIDeviceFamily 가 [1,2] 로 나와 iPad 앱이 된다.
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FocusCore:
    path: FocusCore

targets:
  ## ─────────────────────────────────────────────────────────────
  ## iOS 앱
  ## ─────────────────────────────────────────────────────────────
  Jipjungryeok:
    type: application
    platform: iOS
    sources:
      - path: Jipjungryeok
        excludes:
          - "Info.plist"
          - "*.entitlements"
      ## 디자인 토큰 Color Set 과 App Group 상수는 위젯 타겟과 공유한다.
      ## §13-4 의 "위젯이 Asset Catalog 를 공유하지 못하는" 사고를 구조적으로 막는다.
      - path: Shared
    dependencies:
      - package: FocusCore
        product: FocusCore
      - target: FocusWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.janerim.jipjungryeok
        PRODUCT_NAME: Jipjungryeok
        TARGETED_DEVICE_FAMILY: "1"
        ## 아이콘은 앱 타겟에만 있다. Jipjungryeok/AppIcon.xcassets 참고.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
    info:
      path: Jipjungryeok/Info.plist
      properties:
        ## 홈화면·App Store 에 보이는 이름만 한글. 타겟/폴더/파일명은 영문 유지 (§1-1)
        CFBundleDisplayName: 집중력
        ## 빌드 설정을 참조하게 해야 project.yml 의 버전이 실제로 반영된다.
        ## 값을 직접 적어 두면 Info.plist 에 박히고, XcodeGen 은 이미 있는 파일을
        ## 덮어쓰지 않아서 버전을 올려도 옛 값이 그대로 나간다 — 1.0 때 실제로 그랬다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ## §7 캘린더 — iOS 15 에는 쓰기 전용 권한이 없어서 전체 접근 하나만 요청한다.
        ## iOS 16 이하는 이 키를 읽는다. 없으면 요청하는 순간 앱이 죽는다.
        NSCalendarsUsageDescription: 완료한 집중 세션을 캘린더에 기록하고, 기록할 캘린더를 고를 수 있도록 캘린더 목록을 읽습니다. 일정 내용을 수집하거나 외부로 보내지 않습니다.
        ## iOS 17 이상에서는 같은 요청(`requestAccess(to:)`)이 전체 접근으로 취급되어 이 키를 읽는다.
        ## 이 브랜치는 iOS 15 기기용이지만, iOS 17 시뮬레이터로 확인할 때 죽지 않도록 남긴다.
        NSCalendarsFullAccessUsageDescription: 완료한 집중 세션을 캘린더에 기록하고, 기록할 캘린더를 고를 수 있도록 캘린더 목록을 읽습니다. 일정 내용을 수집하거나 외부로 보내지 않습니다.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Jipjungryeok/Jipjungryeok.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.janerim.jipjungryeok

  ## ─────────────────────────────────────────────────────────────
  ## 위젯 익스텐션
  ## §13-1: App Group Capability 는 앱·위젯 양쪽에 모두 붙어야 한다.
  ## 여기서 두 타겟 다 entitlements 를 선언하므로 한쪽만 빠지는 실수가 나지 않는다.
  ## ─────────────────────────────────────────────────────────────
  FocusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: FocusCore
        product: FocusCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.janerim.jipjungryeok.widgets
        PRODUCT_NAME: FocusWidgets
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        SKIP_INSTALL: YES
    info:
      path: FocusWidgets/Info.plist
      properties:
        CFBundleDisplayName: 집중력
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FocusWidgets/FocusWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.janerim.jipjungryeok

schemes:
  Jipjungryeok:
    build:
      targets:
        Jipjungryeok: all
    run:
      config: Debug
    ## 테스트 타겟을 일부러 비워 둔다. 자동 테스트는 `cd FocusCore && swift test` 하나로 간다.
    ## FocusCoreTests 는 로컬 패키지 안에 있어 XcodeGen 이 스킴에 넣지 못하고
    ## (프로젝트 타겟만 참조 가능 — 넣으면 generate 자체가 validation 에러로 죽는다),
    ## 앱 타겟용 테스트 번들은 만들지 않기로 했다. 사유는 CLAUDE.md 규칙 1.
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
